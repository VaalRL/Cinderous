name = "cinder-relay"
main = "src/worker.ts"
compatibility_date = "2024-12-01"

# 單一全域房間：以 Durable Object 在記憶體中保存連線並做 Ephemeral 扇出。
[[durable_objects.bindings]]
name = "RELAY_ROOM"
class_name = "RelayRoom"

[[migrations]]
tag = "v1"
# SQLite-backed Durable Object：符合 Workers 免費層；此 DO 僅在記憶體持有 WebSocket
# 連線、不用持久儲存，故 backend 選擇不影響行為（亦為未來離線留言存於 DO SQLite 鋪路）。
new_sqlite_classes = ["RelayRoom"]

# 公共 TURN 保底（ADR-0243）：設定後 `GET /turn` 會向 Cloudflare 換發短期 TURN 憑證給客戶端，
# 一般使用者在對稱 NAT／嚴格防火牆下通話才有退路。**未設＝端點回 204、客戶端退回純 STUN**（no-op）。
#   1. 在 Cloudflare 開一個 TURN app，取得 Key ID 與 API Token。
#   2. `TURN_KEY_ID` 放這裡（非機密）；API Token 用 `wrangler secret put TURN_API_TOKEN`（機密、勿寫檔）。
#   3. 於 Cloudflare 端設**用量上限**封頂（ADR-0243 的「有上限」）。
[vars]
TURN_KEY_ID = "99042103a647961e049a2783b8e87d3b"
TURN_TTL_SECONDS = "300"   # 短期憑證秒數，未設＝1 天；客戶端於 6h 前刷新

# 營運者自報的贊助管道（ADR-0089）：進 NIP-11 的 `cinder_donations`，客戶端的贊助卡據此顯示。
# 純外部連結，無站內托管／錢包／抽成（PRD §12）。
#
# 🔴 **沒有的管道就整行不要寫**。空字串會被濾掉、四個全空則整個欄位不出現——那是刻意的：
# 一份宣稱有贊助入口、點下去卻是空的文件，比沒有入口更糟。
#
# 與官網 `apps/website/src/donations.ts` 同一組真實帳號；那邊也只開了 Buy Me a Coffee，
# 其餘待正式上線再補（佔位連結會 404）。
DONATE_BUY_ME_A_COFFEE = "https://buymeacoffee.com/whoami885"

# 取得速率限制（ADR-0342 §3.1）：客戶端每半個 TTL 才取一次（TTL 300 ⇒ 2.5 分鐘一張），
# 20/60s 對正常使用綽綽有餘；配合短 TTL，濫用者要維持流量就得持續取新憑證。
# ⚠ per-location 計數且最終一致（Cloudflare 明說不是精確計費系統）——成本乘數，不是閘門。
[[ratelimits]]
name = "TURN_LIMIT"
namespace_id = "1001"

[ratelimits.simple]
limit = 20
period = 60

# ── 統一節點模式（ADR-0354，選配）───────────────────────────────────────────────
# 預設（上面那份設定）＝**純 relay**：只轉發密文，不送任何程式碼給瀏覽器——攻擊面最小，
# 官方錨點站恆用此模式。下面的 `unified` 環境則讓**同一座 Worker 同時是網頁版**：
# 一個網址，朋友用瀏覽器打開就能聊，自己在 App／Obsidian 填它當中繼站。
#
#   純 relay：      pnpm --filter @cinderous/relay deploy
#   relay＋網頁版： pnpm --filter @cinderous/relay deploy:unified
#
# 兩者 `name` 相同＝同一座 Worker 就地覆蓋，切換模式只是重跑另一條指令（無需改檔）。
#
# ⚠ 取捨（ADR-0147 信任模型）：統一模式下這台伺服器**同時送出客戶端 JS**，它被入侵就等於
#   能換掉程式碼竊取金鑰；純 relay 模式沒有這條路徑。自架者自負此信任，官方站不採用。
#
# ⚠ wrangler 的 `[env.*]` **不繼承**上層綁定，故 DO／migrations／vars 需在此重新宣告。
[env.unified]
name = "cinder-relay"

# 🔴 `run_worker_first` 必設：Static Assets 預設「資產優先」——命中資產就直接回傳、
#    **根本不執行 Worker**。而 `/` 有 `index.html`、又正是 ADR-0241 舊客戶端的 WebSocket
#    回退路徑 ⇒ 少了這行，`wss://<你的站>/` 會拿到 HTML，relay 被靜默關掉（回 200，不是錯誤）。
[env.unified.assets]
# 🔴 **不是 `dist`**。`dist` 是桌面版 `tauri build` 吃的那一份（`__SELF_RELAY__` 為 false）。
# 共用同一個資料夾的話，跑過 `deploy:unified` 之後那裡會留著統一模式的建置產物，
# 而一次 stale-dist 的桌面建置就會出貨一個預設中繼站指向 `wss://tauri.localhost` 的 App。
directory = "../apps/desktop/dist-unified"
binding = "ASSETS"
not_found_handling = "single-page-application"   # 深層路由（/chat/npub1…）回退 index.html
run_worker_first = true

[[env.unified.durable_objects.bindings]]
name = "RELAY_ROOM"
class_name = "RelayRoom"

[[env.unified.migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]

# ⚠ 這一份與頂層的 `[vars]` **必須手動同步**——wrangler 的具名環境不繼承。
# 漏掉哪一個，統一模式部署出來的站就少哪一個（贊助欄位會整個消失、TURN 會退純 STUN），
# 而且 wrangler 不會警告。`wrangler_vars_stay_in_sync` 測試盯著這件事。
[env.unified.vars]
TURN_KEY_ID = "99042103a647961e049a2783b8e87d3b"
TURN_TTL_SECONDS = "300"
DONATE_BUY_ME_A_COFFEE = "https://buymeacoffee.com/whoami885"

[[env.unified.ratelimits]]
name = "TURN_LIMIT"
namespace_id = "1001"

[env.unified.ratelimits.simple]
limit = 20
period = 60
