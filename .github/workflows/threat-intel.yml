name: 威脅情報 snapshot 更新（ADR-0231 P2）

# 每日重建 docs/threat-intel.json（URLhaus CC0＋StevenBlack MIT，抽 registrable domain）。
# 有變更才提交；提交會觸發 pages.yml 重新部署官網（paths 含 docs/threat-intel.json）。
# 純 node 內建（fetch/fs），不需 pnpm install。
on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:
    inputs:
      reseed:
        description: "重設變動量護欄基準（來源組成刻意變動時用，例如首次建聯集或加減 feed；ADR-0248）"
        type: boolean
        default: false

permissions:
  contents: write
  # 觸發 pages.yml 重佈用（GITHUB_TOKEN 推送不會觸發其他 workflow 的 push 事件——GitHub 防遞迴限制）。
  actions: write

concurrency:
  group: threat-intel
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: 抓取來源並重建 snapshot
        # 手動 dispatch 勾 reseed＝跳過變動量護欄重設基準（ADR-0248）；排程一律不帶（inputs 為空即 falsy）。
        run: node scripts/threat-snapshot.mjs ${{ inputs.reseed && '--reseed' || '' }}

      - name: 驗證格式
        run: node scripts/threat-snapshot.mjs --check

      - name: 提交 snapshot 變更（若有）＋觸發官網重佈
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain docs/threat-intel.json docs/threat-intel.feeds.json)" ]; then
            git config user.name "threat-intel-bot"
            git config user.email "bot@users.noreply.github.com"
            # 逐-feed 記憶檔一起提交（ADR-0248）：CI 每次都是全新環境，沒有 committed 記憶就救不回暫時掛掉的 feed。
            git add docs/threat-intel.json docs/threat-intel.feeds.json
            git commit -m "chore(threat-intel): 自動更新威脅情報 snapshot（ADR-0231 P2）"
            git push
            # GITHUB_TOKEN 的 push 不會觸發 pages.yml 的 push 事件（GitHub 防遞迴限制）
            # → 明確 dispatch 重新部署官網，否則 app 永遠拉不到新 snapshot。
            gh workflow run pages.yml --ref main
          else
            echo "snapshot 無變化，略過提交與重佈。"
          fi
