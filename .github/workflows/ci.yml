name: CI

on:
  push:
    branches: [main]
  pull_request:

# 最小權限（ADR-0235 M2）：CI 只需要讀出原始碼。未宣告時會沿用 repo 的預設 token 權限
# ——那可能是讀寫，等於每個 job（含第三方 action）都握著能推 main 的 token。
permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript（typecheck + test + build）
    runs-on: ubuntu-latest
    steps:
      # Action 一律釘 commit SHA（ADR-0235 C5）：`@v4` 是**可變** tag，上游帳號被盜或 tag
      # 被移動，就等於在我們的 runner 上執行任意程式碼。註解保留人類看得懂的版本。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 版本由 package.json 的 `packageManager`（pnpm@10.x）決定；這裡再指定 version 會觸發
      # 「Multiple versions of pnpm specified」而讓整條 CI 卡在 setup（測試根本沒跑到）。
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      # `--ignore-scripts`（ADR-0235 C5）：不執行任何相依的 install 生命週期腳本。
      # pnpm 10 預設已封鎖（無 `onlyBuiltDependencies`），這行是把它變成**明示的契約**
      # ——日後有人為了某個套件加上允許清單時，會先看到這裡。
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm version:check # ADR-0227：全平台版號須與 SSOT（root package.json）一致，漂移即 fail
      - run: pnpm -r typecheck
      - run: pnpm -r test
      # root scripts/ 不在 pnpm workspace（`pnpm -r test` 掃不到）→ 用 Node 內建 runner 跑其純邏輯測試（ADR-0248）。
      # 傳明確 glob（bash 展開）而非目錄：`node --test <dir>` 的目錄探索語意跨 Node 版本不一致。
      - run: node --test scripts/*.test.mjs
      - run: pnpm --filter @cinderous/desktop build

  audit:
    name: 相依弱點掃描（ADR-0235 M2）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # 硬閘：**會出貨給使用者**的相依必須零已知弱點。這是一個 E2E 加密通訊軟體，
      # 產品相依樹裡的洞不該等到有人回報才知道。
      - name: 出貨相依（硬閘）
        run: pnpm audit --prod --audit-level low
      # 開發工具鏈（vite dev server／vitest UI／esbuild）不隨產品出貨，其弱點多半要求
      # 「跑著 dev server 且被惡意網站造訪」。仍然要**看得見**——但不讓它變成一盞永遠亮著、
      # 大家學會忽略的紅燈。目前已知：vite 5→6、vitest 2→3 的升級債（見 ADR-0235 後續行動）。
      - name: 開發工具鏈（僅報告）
        continue-on-error: true
        run: pnpm audit --audit-level high
      # 釘版本＋釘 sha256 的預編 binary（ADR-0351）。
      #
      # 原本是 `cargo install cargo-audit --locked`，有兩個問題：
      #   1. **每次都從原始碼重編**（數分鐘）——這是整條 CI 最貴的單一步驟。
      #   2. **版本沒釘**：上游發佈什麼就裝什麼。而這個工具的職責正是供應鏈安全，
      #      卻是整個 CI 裡唯一不受 ADR-0235 C5「一律釘死」約束的東西。
      #
      # musl 靜態連結，在任何 runner 上都跑得起來。升級＝改下面兩行（版本與雜湊必須同時改，
      # 雜湊對不上即中止——這正是釘死的意義）。
      - name: cargo audit（Rust 出貨密碼學相依）
        env:
          CARGO_AUDIT_VERSION: "0.22.2"
          CARGO_AUDIT_SHA256: "7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428"
        run: |
          set -euo pipefail
          asset="cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}"
          # 標籤是 `cargo-audit/v<版本>`，路徑中的 `/` 必須編碼成 %2F。
          curl -fsSL -o /tmp/cargo-audit.tgz \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${CARGO_AUDIT_VERSION}/${asset}.tgz"
          echo "${CARGO_AUDIT_SHA256}  /tmp/cargo-audit.tgz" | sha256sum -c -
          tar xzf /tmp/cargo-audit.tgz -C /tmp
          # 放進 cargo 的 bin 目錄＝`cargo audit` 找得到它，與原本 `cargo install` 的落點一致。
          install -m 0755 "/tmp/${asset}/cargo-audit" "$HOME/.cargo/bin/cargo-audit"
          cargo audit
        working-directory: apps/desktop/src-tauri

  rust:
    name: Rust（cargo test + clippy — 出貨密碼學）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      # default feature 現為 `passlock`（含 encstore、partfile、aikey），故這行測的是**真正會出貨**的
      # 加密儲存、本地密碼/救援、檔案安全原語與 AI 金鑰端點綁定（ADR-0105/0119/0235）。
      # 在此之前 default 是空的，`cargo test` 只跑到 ipc/session/reconnect 那些從未出貨的死碼
      # ——13 個真測試一次都沒跑過。
      # `keyring` 不入 default：其測試會存取真實 OS 金鑰庫，CI 容器裡不可用。
      #
      # ⚠ 這個 job **編不到 `main.rs`**——它是 `required-features = ["tauri-app"]` 的 bin
      # target，不開那個 feature 就不會被編譯（`partfile.rs` 檔頭早就記下這件事）。
      # 補編譯由下面的 `tauri-app` job 負責；**不要**在這裡加 `--features tauri-app`：
      # 那會把 `keyring` 一起開進來，而它的測試需要真實 OS 金鑰庫，CI 容器裡必定失敗
      # （實測：24 passed、1 failed）。所以那個 job 只做 check ＋ clippy，不做 test。
      - run: cargo test
        working-directory: apps/desktop/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri

  tauri-app:
    name: Rust（tauri-app feature — 讓 main.rs 真的被編譯）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      # Tauri 的 webview 綁定（webkit2gtk-sys／javascriptcore-rs-sys）在 **build script**
      # 就要 pkg-config 找得到系統庫——沒裝的話連 `cargo check` 都過不了。
      - name: 安裝 Tauri 系統相依
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev
      # ⏱ 相依樹比 lib-only 大一個量級（tauri＋reqwest＋rfd＋keyring…），冷編約數分鐘。
      # 這裡**刻意不加快取 action**：本 repo 規定 action 必須釘 commit SHA（ADR-0235 C5），
      # 而憑記憶寫一個 SHA 只會讓 CI 掛掉。要加的話請自行查出正確 SHA 再釘上。
      - run: cargo check --features tauri-app
        working-directory: apps/desktop/src-tauri
      # `--all-targets` 連測試碼一起編（但不執行），所以 main.rs 與它的 `#[tauri::command]`
      # 全都會被 clippy 看過。
      - run: cargo clippy --all-targets --features tauri-app -- -D warnings
        working-directory: apps/desktop/src-tauri
